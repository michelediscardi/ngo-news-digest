# ---------------------------------------------------------------
#  NGO News Digest – settings
#  You can edit this file directly on GitHub (pencil icon ✏️).
#  Rules: keep the spaces at the start of each line exactly as they are,
#  and put text that contains ":" or "#" inside "quotes".
# ---------------------------------------------------------------

newsletter:
  name: "NGO World Digest"          # shown at the top of the email
  tagline: "The week's most relevant news from the NGO sector"
  accent_color: "#0a523a"           # main colour of the email: El Cami dark green
  highlight_color: "#e9ff5e"        # thin highlight bar under the header: El Cami yellow

# Logo and links shown at the top of the app (they open in a new window)
brand:
  logo: assets/elcami-wordmark-green.png
  name: "El Cami"
  website_url: "https://elcami.eu/"
  donate_url: "https://elcami.eu/donate#donate-box"

# How many days back to look by default (you can change it in the app too)
default_days: 7

# ---------------------------------------------------------------
#  SOURCES – each one needs a name, a feed address (RSS) and a language.
#  language: en = English, es = Spanish
#  only_on_theme: true  = keep only articles that match one of the THEMES
#  below (useful for general newspaper sections, to skip unrelated news).
#  To add a source: copy its lines, change them. To remove: delete them.
# ---------------------------------------------------------------
